<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Location Mapper</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
        crossorigin=""/>
  
  <!-- Leaflet Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  
  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Map Container -->
  <div id="map"></div>

  <!-- Google Maps-Style Left Panel -->
  <div class="left-panel">
    <!-- Categories Section -->
    <div class="categories-section">
      <h3>Categories</h3>
      <div id="listToggles">
        <div class="empty-state">No markers yet. Click on the map to add locations!</div>
      </div>
    </div>
  </div>

  <!-- Google Maps-Style Right Panel -->
  <div class="right-panel">
    <!-- Transport Mode Section -->
    <div class="transport-section">
      <h3>Transport Mode</h3>
      <div class="transport-buttons">
        <button class="transport-btn driving active" data-mode="driving">
          <span class="btn-label">Driving</span>
        </button>
        <button class="transport-btn walking" data-mode="walking">
          <span class="btn-label">Walking</span>
        </button>
        <button class="transport-btn cycling" data-mode="cycling">
          <span class="btn-label">Cycling</span>
        </button>
      </div>
      
      <!-- Turn-by-Turn Directions Section -->
      <div class="directions-section">
        <div class="directions-header-inline">
          <h4>Show Turn-by-Turn Directions</h4>
        </div>
        <div class="directions-list-inline" style="display: none; margin-top: 8px;">
          <!-- Directions will be inserted here -->
        </div>
      </div>
    </div>
    
    <!-- Route Info Section -->
    <div class="route-info-panel">
      <h3>Route Information</h3>
      <div id="routeInfo">
        <p style="color: #666; font-size: 14px; margin: 0;">No route created yet</p>
      </div>
    </div>
  </div>

  <!-- Map Styles Dropdown -->
  <div class="map-styles-dropdown">
    <button class="map-styles-toggle" id="mapTypesToggle" aria-expanded="false" aria-haspopup="listbox">
      <span class="current-map-type">Default</span>
      <span class="dropdown-arrow">▼</span>
    </button>
    <div class="map-styles-menu" id="mapTypesDropdown" role="listbox" aria-label="Map Styles">
      <div class="map-type-option" data-style="Default" role="option" aria-selected="true">
        <span class="option-label">Default</span>
      </div>
      <div class="map-type-option" data-style="Faded" role="option" aria-selected="false">
        <span class="option-label">Faded</span>
      </div>
      <div class="map-type-option" data-style="Cool" role="option" aria-selected="false">
        <span class="option-label">Cool</span>
      </div>
      <div class="map-type-option" data-style="Dark 2D" role="option" aria-selected="false">
        <span class="option-label">Dark 2D</span>
      </div>
      <div class="map-type-option" data-style="Light 2D" role="option" aria-selected="false">
        <span class="option-label">Light 2D</span>
      </div>
      <div class="map-type-option" data-style="Satellite" role="option" aria-selected="false">
        <span class="option-label">Satellite</span>
      </div>
      <div class="map-type-option" data-style="Outdoors" role="option" aria-selected="false">
        <span class="option-label">Outdoors</span>
      </div>
      <div class="map-type-option" data-style="Warm" role="option" aria-selected="false">
        <span class="option-label">Warm</span>
      </div>
    </div>
  </div>

  <!-- Bottom Center Buttons Container -->
  <div class="bottom-buttons-container">
    <button class="gm-button primary" id="drawRouteBtn">
      <span>Draw Route</span>
    </button>
    <button class="gm-button secondary" id="clearRouteBtn">
      <span>Clear Route</span>
    </button>
    <button class="gm-button secondary" id="toggleLocationBtn">
      <span>Toggle Location</span>
    </button>
  </div>

  <!-- Map Controls -->
  <div class="map-controls-bottom-left"></div>
  <div class="map-controls-bottom-right"></div>

  <!-- ═══════════════════════════════════════════════════
       SCRIPTS — load order matters:
       1. config.js         (credentials)
       2. supabase CDN      (supabase-js UMD bundle)
       3. supabase-service  (SupabaseService class + singleton)
       4. auth-ui           (injects auth button/modal)
       5. routing-service   (RoutingService class)
       6. leaflet           (map library)
       7. leaflet routing   (routing machine plugin)
       8. app.js            (main app — runs last)
  ═══════════════════════════════════════════════════ -->
  <script src="config.js?v=3"></script>

  <!-- Supabase JS v2 (UMD bundle — exposes window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script src="supabase-service.js?v=3"></script>
  <script src="auth-ui.js?v=3"></script>
  <script src="routing-service.js?v=3"></script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script src="app.js?v=3"></script>
</body>
</html>

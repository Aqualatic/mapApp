<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Mapper</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
        crossorigin=""/>
  
  <!-- Leaflet Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  
  <!-- Geocoder CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css" />
  
  <!-- Custom styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Map Container -->
  <div id="map"></div>

  <!-- Categories Panel -->
  <div class="list-panel" id="listToggles">
    <h3>Categories</h3>
    <div class="empty-state">No markers yet. Click on the map to add locations!</div>
  </div>

  <!-- Controls Panel -->
  <div class="control-panel">
    <h3>Controls</h3>
    <button class="btn btn-primary" id="drawRouteBtn">Draw Route</button>
    <button class="btn btn-danger" id="clearRouteBtn" disabled>Clear Route</button>
    <button class="btn btn-secondary" id="toggleLocationBtn">Toggle My Location</button>
  </div>

  <!-- Modal (injected by JavaScript) -->

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>
  <script src="app.js"></script>
</body>
</html>
